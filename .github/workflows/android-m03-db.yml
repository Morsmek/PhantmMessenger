name: M03 — Android SQLCipher Database Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/setup-phantm-project-5LO5k'
    paths:
      - 'shared/src/androidMain/kotlin/com/stagic/phantm/db/**'
      - 'shared/src/androidInstrumentedTest/kotlin/com/stagic/phantm/db/**'
      - 'gradle/libs.versions.toml'
      - 'shared/build.gradle.kts'
      - '.github/workflows/android-m03-db.yml'

jobs:
  instrumented-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - name: Run M03 Android SQLCipher instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >
            ./gradlew :shared:connectedAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.stagic.phantm.db.AndroidDatabaseTest
            --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-test-results
          path: shared/build/outputs/androidTest-results/
